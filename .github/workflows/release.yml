name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  uber-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set version from tag
        run: |
          chmod +x ./mvnw
          ./mvnw -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build and test uber-jar
        run: ./mvnw -B verify -Duber-jar -DskipITs=false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uber-jar
          path: target/openjdk-helper-*-runner.jar
          if-no-files-found: error

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
            exe: ''
          - os: ubuntu-24.04-arm
            suffix: linux-aarch64
            exe: ''
          - os: macos-latest
            suffix: macos-aarch64
            exe: ''
          - os: windows-latest
            suffix: windows-x86_64
            exe: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Set up Node.js for MCP bundles
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcpb/package-lock.json

      - name: Install bundle tools
        run: npm ci --prefix mcpb --ignore-scripts

      - name: Set version from tag
        shell: bash
        run: |
          chmod +x ./mvnw
          ./mvnw -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      # verify runs both test phases and propagates native smoke-test failures.
      - name: Build and test native executable
        shell: bash
        run: ./mvnw -B verify -Dnative -Dquarkus.native.container-build=false

      - name: Rename binary
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv "target/openjdk-helper-${VERSION}-runner${{ matrix.exe }}" \
             "target/openjdk-helper-${VERSION}-${{ matrix.suffix }}${{ matrix.exe }}"

      - name: Package and test MCP bundle
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node mcpb/pack.mjs "$VERSION" "${{ matrix.suffix }}" \
            "target/openjdk-helper-${VERSION}-${{ matrix.suffix }}${{ matrix.exe }}"
          node mcpb/test-mcpb.mjs "target/openjdk-helper-${VERSION}-${{ matrix.suffix }}.mcpb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.suffix }}
          path: |
            target/openjdk-helper-*-${{ matrix.suffix }}${{ matrix.exe }}
            target/openjdk-helper-*-${{ matrix.suffix }}.mcpb
          if-no-files-found: error

      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.suffix }}
          path: target/failsafe-reports

  docker:
    needs: [uber-jar, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set version from tag
        run: |
          chmod +x ./mvnw
          ./mvnw -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build fast-jar for Docker
        run: ./mvnw -B clean package -DskipTests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push JVM Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/main/docker/Dockerfile.jvm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            greystone/openjdk-helper:${{ steps.version.outputs.VERSION }}
            greystone/openjdk-helper:latest

  release:
    needs: [uber-jar, native, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download uber-jar
        uses: actions/download-artifact@v4
        with:
          name: uber-jar
          path: artifacts

      - name: Download native executables
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
