name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  uber-jar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set version from tag
        run: |
          chmod +x ./mvnw
          ./mvnw -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build and test uber-jar
        run: ./mvnw -B verify -Duber-jar -DskipITs=false

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: uber-jar
          path: target/openjdk-helper-*-runner.jar
          if-no-files-found: error

  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            suffix: linux-x86_64
            exe: ''
          - os: ubuntu-24.04-arm
            suffix: linux-aarch64
            exe: ''
          - os: macos-latest
            suffix: macos-aarch64
            exe: ''
          - os: windows-latest
            suffix: windows-x86_64
            exe: '.exe'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: maven

      - name: Set up Node.js for MCP bundles
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: mcpb/package-lock.json

      - name: Install bundle tools
        run: npm ci --prefix mcpb --ignore-scripts

      - name: Set version from tag
        shell: bash
        run: |
          chmod +x ./mvnw
          ./mvnw -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      # verify runs both test phases and propagates native smoke-test failures.
      - name: Build and test native executable
        shell: bash
        run: ./mvnw -B verify -Dnative -Dquarkus.native.container-build=false

      - name: Rename binary
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mv "target/openjdk-helper-${VERSION}-runner${{ matrix.exe }}" \
             "target/openjdk-helper-${VERSION}-${{ matrix.suffix }}${{ matrix.exe }}"

      # macOS: signing and notarization run on the renamed binary, so the bare asset and the bundle both carry
      # the signature. Windows: the binary and bundle are published unsigned. Windows code signing uses a
      # Certum certificate through SimplySign Desktop, which needs an OTP login with no clean headless path on
      # GitHub-hosted runners, so mcpb/Sign-Release.ps1 signs the published binary on the maintainer's machine
      # and replaces both release assets afterwards.
      - name: Import Developer ID certificate
        if: runner.os == 'macOS'
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
        run: |
          set -euo pipefail
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PWD="$(openssl rand -hex 24)"
          printf '%s' "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PWD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -P "$MACOS_CERTIFICATE_PWD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PWD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          rm -f "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      - name: Sign and notarize native executable
        if: runner.os == 'macOS'
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          NOTARIZATION_APPLE_ID: ${{ secrets.NOTARIZATION_APPLE_ID }}
          NOTARIZATION_PASSWORD: ${{ secrets.NOTARIZATION_PASSWORD }}
          NOTARIZATION_TEAM_ID: ${{ secrets.NOTARIZATION_TEAM_ID }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          BINARY="target/openjdk-helper-${VERSION}-${{ matrix.suffix }}"
          codesign --force --timestamp --options runtime --sign "$MACOS_SIGNING_IDENTITY" "$BINARY"
          codesign --verify --strict --verbose=2 "$BINARY"
          # notarytool accepts a zip of a bare Mach-O; the ticket is verified online, a bare executable cannot be stapled.
          ditto -c -k --keepParent "$BINARY" "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$NOTARIZATION_APPLE_ID" --password "$NOTARIZATION_PASSWORD" --team-id "$NOTARIZATION_TEAM_ID" \
            --wait --timeout 30m
          codesign -dvv "$BINARY" 2>&1 | grep -E 'Authority=Developer ID Application|Timestamp='

      - name: Clean up keychain
        if: runner.os == 'macOS' && always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true

      # The bundle smoke test launches the packed binary, so on macOS it exercises the hardened-runtime signature.
      - name: Package and test MCP bundle
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          node mcpb/pack.mjs "$VERSION" "${{ matrix.suffix }}" \
            "target/openjdk-helper-${VERSION}-${{ matrix.suffix }}${{ matrix.exe }}"
          node mcpb/test-mcpb.mjs "target/openjdk-helper-${VERSION}-${{ matrix.suffix }}.mcpb"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: native-${{ matrix.suffix }}
          path: |
            target/openjdk-helper-*-${{ matrix.suffix }}${{ matrix.exe }}
            target/openjdk-helper-*-${{ matrix.suffix }}.mcpb
          if-no-files-found: error

      - name: Upload native test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.suffix }}
          path: target/failsafe-reports

  docker:
    needs: [uber-jar, native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Set version from tag
        run: |
          chmod +x ./mvnw
          ./mvnw -B versions:set -DnewVersion="${GITHUB_REF_NAME#v}" -DgenerateBackupPoms=false

      - name: Build fast-jar for Docker
        run: ./mvnw -B clean package -DskipTests

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and push JVM Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/main/docker/Dockerfile.jvm
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            greystone/openjdk-helper:${{ steps.version.outputs.VERSION }}
            greystone/openjdk-helper:latest

  # Multi-architecture image around the GraalVM binaries of the native matrix (linux/amd64 and linux/arm64, for
  # example Raspberry Pi clusters). Published next to the JVM image; it does not gate the GitHub release.
  native-docker:
    needs: [native]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux native binaries
        uses: actions/download-artifact@v4
        with:
          pattern: native-linux-*
          path: artifacts
          merge-multiple: true

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Stage binaries per architecture
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p target/native/amd64 target/native/arm64
          cp "artifacts/openjdk-helper-${VERSION}-linux-x86_64" target/native/amd64/openjdk-helper
          cp "artifacts/openjdk-helper-${VERSION}-linux-aarch64" target/native/arm64/openjdk-helper
          chmod +x target/native/*/openjdk-helper

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/main/docker/Dockerfile.native-release
          platforms: linux/amd64
          load: true
          tags: openjdk-helper:native-smoke-amd64

      - name: Build arm64 image for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/main/docker/Dockerfile.native-release
          platforms: linux/arm64
          load: true
          tags: openjdk-helper:native-smoke-arm64

      # Both architectures are started (arm64 under QEMU) and must answer /version with the release version
      # and serve a census lookup before anything is pushed.
      - name: Smoke test native images
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          for arch in amd64 arm64; do
            CID=$(docker run -d --platform "linux/$arch" -p 8080:8080 "openjdk-helper:native-smoke-$arch")
            for i in $(seq 1 120); do curl -fs http://127.0.0.1:8080/version > /dev/null && break; sleep 1; done
            ACTUAL="$(curl -fs http://127.0.0.1:8080/version || true)"
            if [ "$ACTUAL" != "$VERSION" ]; then
              echo "::error::$arch native image answered '$ACTUAL' instead of '$VERSION'"
              docker logs "$CID"; docker rm -f "$CID"; exit 1
            fi
            curl -fs "http://127.0.0.1:8080/census/people?userid=hirt" | grep -q '"userId":"hirt"'
            docker rm -f "$CID"
            echo "$arch native image OK"
          done

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push multi-architecture native image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./src/main/docker/Dockerfile.native-release
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            greystone/openjdk-helper:${{ steps.version.outputs.VERSION }}-native
            greystone/openjdk-helper:native

  release:
    needs: [uber-jar, native, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Download uber-jar
        uses: actions/download-artifact@v4
        with:
          name: uber-jar
          path: artifacts

      - name: Download native executables
        uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: artifacts/*
          fail_on_unmatched_files: true
