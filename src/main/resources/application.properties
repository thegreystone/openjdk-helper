# HTTP serves the existing REST API and both MCP HTTP transports.
quarkus.http.port=8080
quarkus.http.host=0.0.0.0
quarkus.http.enable-compression=true

# stdout is reserved for MCP JSON-RPC, including when stdio is enabled directly.
quarkus.banner.enabled=false
quarkus.log.console.enabled=true
quarkus.log.console.stderr=true
quarkus.log.console.format=%d{HH:mm:ss} %-5p [%c{2.}] (%t) %s%e%n
quarkus.log.console.level=INFO
%dev.quarkus.log.console.level=DEBUG

# Native builds use a locally installed GraalVM unless explicitly overridden.
quarkus.native.container-build=false
quarkus.native.add-all-charsets=true
quarkus.native.resources.includes=project-processes.json
quarkus.native.march=compatibility
quarkus.container-image.build=false
quarkus.container-image.group=greystone
quarkus.container-image.name=openjdk-helper
quarkus.container-image.tag=latest

# Preserve the public Custom GPT/OpenAPI endpoints behind the /openjdk proxy.
quarkus.smallrye-openapi.path=/openapi
quarkus.swagger-ui.path=/swagger-ui
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.urls.default=../openapi
quarkus.smallrye-openapi.servers=https://api.hirt.se/openjdk
quarkus.smallrye-openapi.operation-id-strategy=method
quarkus.http.proxy.proxy-address-forwarding=true
quarkus.http.proxy.enable-forwarded-host=true
quarkus.http.proxy.enable-forwarded-prefix=true

# Public, read-only API; browser MCP clients need access to the session header.
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=*
quarkus.http.cors.methods=GET,POST,DELETE,OPTIONS
quarkus.http.cors.headers=Origin,Content-Type,Accept,Authorization,X-Requested-With,Cache-Control,Content-Length,MCP-Protocol-Version,MCP-Session-Id,Last-Event-ID
quarkus.http.cors.exposed-headers=Content-Disposition,Content-Length,Content-Type,MCP-Session-Id,X-Page,X-Page-Size,X-Has-More,X-Next-Page,Retry-After
quarkus.http.cors.access-control-max-age=24H
quarkus.http.cors.access-control-allow-credentials=false

# Quarkus supplies the application version from pom.xml at build time.
quarkus.mcp.server.server-info.name=OpenJDK Helper
quarkus.mcp.server.server-info.version=${quarkus.application.version}
quarkus.mcp.server.http.root-path=/mcp
quarkus.mcp.server.traffic-logging.enabled=false
quarkus.mcp.server.stdio.enabled=false
quarkus.mcp.server.tools.page-size=100

# Local desktop clients: -Dquarkus.profile=stdio (also works in native images).
%stdio.quarkus.mcp.server.stdio.enabled=true
%stdio.quarkus.http.host-enabled=false
